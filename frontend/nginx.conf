server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # La API vive en otro contenedor; el navegador solo habla con este servidor.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los archivos con hash en el nombre se pueden cachear para siempre.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
